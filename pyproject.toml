[project]
name = "market-research-assistant"
version = "0.1.0"
description = "Evidence-backed multi-agent competitive intelligence"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50,<2", "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "tenacity>=9,<10",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["research*"]
[tool.setuptools.package-data]
"research.prompts" = ["*.md", "*.json"]
